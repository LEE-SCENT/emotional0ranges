<!-- 서비스 홈 화면 — GNB + KV. 브레이크포인트 규칙(441 / 961 / 1601)을 따릅니다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감정적인 오렌지들</title>
<link rel="stylesheet" href="./fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="./build/tokens.css">
<link rel="stylesheet" href="./components/container.css">
<link rel="stylesheet" href="./components/badge.css">
<link rel="stylesheet" href="./components/button.css">
<link rel="stylesheet" href="./components/button-group.css">
<link rel="stylesheet" href="./components/segmented-control.css">
<link rel="stylesheet" href="./components/gnb.css">
<link rel="stylesheet" href="./components/kv.css">
<style>
  body { margin: 0; background: var(--colors-bg); color: var(--colors-fg); }
  /* 화면에는 안 보이지만 스크린리더는 읽는 텍스트 */
  .sr-only {
    position: absolute; inline-size: 1px; block-size: 1px;
    margin: -1px; padding: 0; overflow: hidden; white-space: nowrap;
    clip-path: inset(50%);
  }
</style>

<div id="sprite" hidden></div>

<header class="gnb">
  <div class="gnb__inner">
    <div class="gnb__start">
      <a class="gnb__logo" href="/" aria-label="감정적인 오렌지들 홈">
        <svg width="126" height="40" role="img" aria-label="emotional oranges"><use href="#logo-eo"></use></svg>
      </a>
      <div class="gnb__segmented">
        <div class="segmented" role="tablist" aria-label="모임 형태">
          <span class="segmented__thumb" aria-hidden="true"></span>
          <button class="segmented__item is-selected" role="tab" aria-selected="true">온라인</button>
          <button class="segmented__item" role="tab" aria-selected="false">오프라인</button>
        </div>
      </div>
    </div>
    <div class="gnb__end">
      <nav class="gnb__menu" aria-label="주요 메뉴">
        <button class="btn btn--ghost btn--medium"><span class="btn__label">모임</span></button>
        <button class="btn btn--ghost btn--medium"><span class="btn__label">매칭</span></button>
        <button class="btn btn--ghost btn--medium"><span class="btn__label">모임 후기</span></button>
        <button class="btn btn--ghost btn--medium"><span class="btn__label">자주 묻는 질문</span></button>
        <button class="btn btn--ghost btn--medium"><span class="btn__label">저널</span></button>
      </nav>
      <div class="gnb__actions">
        <button class="btn btn--ghost btn--medium btn--icon-only gnb__notify" aria-label="알림">
          <svg class="btn__icon" aria-hidden="true"><use href="#icon-notifications"></use></svg>
        </button>
        <button class="btn btn--blur btn--medium btn--icon-only" aria-label="메뉴 열기">
          <svg class="btn__icon" aria-hidden="true"><use href="#icon-menu"></use></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="container container--wide">
  <section class="kv" aria-roledescription="캐러셀" aria-label="주요 소식">
    <div class="kv__media" data-youtube="9fRsFJAS1-Y" data-title="감정적인 오렌지들 소개 영상"></div>
    <div class="kv__scrim"></div>

    <div class="kv__content">
      <button class="btn btn--blur btn--medium btn--icon-only is-on kv__nav" aria-label="이전 슬라이드">
        <svg class="btn__icon" aria-hidden="true"><use href="#icon-chevronLeft"></use></svg>
      </button>

      <div class="kv__body">
        <div class="kv__title">
          <h1 class="kv__headline">당신은 좋은 사람이예요<br>만날 기회가 없었을 뿐<span class="kv__dot">.</span></h1>
          <p class="kv__sub">앱 소개팅의 피로감도, 결혼정보회사의 부담도 없이<br>직접 만나 대화하며 알아가는 소개팅</p>
        </div>
        <div class="btn-group btn-group--horizontal kv__cta">
          <button class="btn btn--filled btn--large is-on"><span class="btn__label">모임 둘러보기</span></button>
          <button class="btn btn--blur btn--large is-on"><span class="btn__label">매칭 방법 보기</span></button>
        </div>
      </div>

      <button class="btn btn--blur btn--medium btn--icon-only is-on kv__nav" aria-label="다음 슬라이드">
        <svg class="btn__icon" aria-hidden="true"><use href="#icon-chevronRight"></use></svg>
      </button>
    </div>

    <p class="kv__pagination"><b>1</b> <span aria-hidden="true">/</span> <span class="sr-only">중</span> 6</p>
  </section>
</main>

<script type="module">
  document.getElementById('sprite').innerHTML =
    await (await fetch('./build/icons.svg')).text() + await (await fetch('./build/logo.svg')).text()
  const { initSegmentedControls } = await import('./components/segmented-control.js')
  initSegmentedControls()
  const { initKvVideo } = await import('./components/kv.js')
  initKvVideo()
</script>
